# Included by every content location in nginx.conf.
#
# It has to be included in *each* location rather than set once at server level:
# nginx's add_header does not merge across scopes — a single add_header inside a
# location silently discards every header inherited from the http/server block.
#
# `always` makes them apply to error responses too, so a 404 is as protected as
# a 200.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Astro emits no inline scripts by default, but its client directives and view
# transitions do inline small hydration snippets, so 'unsafe-inline' is the
# pragmatic starting point. Tighten it — ideally to a nonce or hash — once you
# know what your own build actually emits.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# HSTS belongs on whatever terminates TLS, not here — this server only ever
# speaks plain HTTP to an ingress or load balancer. Uncomment only if this
# container is itself internet-facing over HTTPS.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
