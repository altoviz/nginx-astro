# ---------------------------------------------------------------------------
# nginx.conf for a static Astro build served by altoviz/nginx-astro.
#
# Line 1 is not optional. The base image ships no opinionated configuration, so
# replacing /etc/nginx/nginx.conf drops the load_module directives with it and
# nginx exits at startup with:  unknown directive "brotli_static".
# ---------------------------------------------------------------------------
include /etc/nginx/modules-enabled/*.conf;

worker_processes auto;

# Container-friendly paths: logs to the Docker collectors, and everything nginx
# writes lives under /tmp so the container can run unprivileged with
# `--read-only` and a tmpfs on /tmp.
pid        /tmp/nginx.pid;
error_log  /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # nginx's bundled mime.types predates these.
    types {
        application/manifest+json  webmanifest;
        application/wasm           wasm;
        image/avif                 avif;
        text/markdown              md;
    }

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" enc=$sent_http_content_encoding';
    access_log /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  30;
    types_hash_max_size 2048;

    # Static-only hardening. Nothing here accepts a request body worth speaking
    # of, so the limits are deliberately tight.
    server_tokens              off;
    ignore_invalid_headers     on;
    reset_timedout_connection  on;
    client_header_timeout      10s;
    client_body_timeout        10s;
    send_timeout               10s;
    client_max_body_size       64k;
    client_body_buffer_size    64k;
    client_header_buffer_size  16k;
    large_client_header_buffers 8 16k;

    limit_req_zone  $binary_remote_addr zone=static_req:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

    # -----------------------------------------------------------------------
    # Compression. `astro-compressor` already wrote index.html.br / .zst / .gz
    # next to every asset at build time, at levels no request-time filter would
    # ever spend the CPU on. So serve those files and compress nothing live.
    #
    # Precedence is brotli > zstd > gzip, decided by the load order in
    # /etc/nginx/modules-enabled/ — not by anything in this file.
    # -----------------------------------------------------------------------
    brotli_static on;
    zstd_static   on;
    gzip_static   on;
    gzip_vary     on;   # keep Vary: Accept-Encoding for correct CDN caching

    brotli off;
    gzip   off;
    zstd   off;

    # If you also serve content Astro did not pre-compress (a proxied API, files
    # uploaded at runtime), turn the brotli filter on for those types only:
    #
    #   brotli            on;
    #   brotli_comp_level 5;
    #   brotli_min_length 1024;
    #   brotli_types      text/plain text/css application/json
    #                     application/javascript text/xml image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Behind a TLS-terminating ingress the pod hop is plain http, so nginx
        # would build absolute redirects as http:// and every redirect would
        # need a second bounce to get back to https. Relative keeps the
        # browser's own scheme and host.
        absolute_redirect off;
        port_in_redirect  off;

        limit_conn per_ip_conn 30;
        limit_req  zone=static_req burst=60 nodelay;

        # Kubernetes probes / Docker HEALTHCHECK.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Astro's content-hashed output. The filename changes whenever the bytes
        # change, so these can be cached forever. `^~` stops the regex locations
        # below from stealing the match.
        # No `expires` directive anywhere below, on purpose: it emits its own
        # Cache-Control alongside the add_header one, and the response then
        # carries two Cache-Control headers — which some CDNs merge and others
        # simply pick the wrong one from. Cache-Control alone supersedes the
        # legacy Expires header for every cache written this century.
        location ^~ /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # Fonts, images and media that are not always fingerprinted.
        location ~* \.(woff2|woff|ttf|otf|eot|jpg|jpeg|png|gif|webp|avif|svg|ico|mp4|webm)$ {
            limit_except GET HEAD { deny all; }
            add_header Cache-Control "public, max-age=31536000" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # Sitemaps, feeds, robots.txt, manifests: stable URLs whose contents
        # change on every deploy, so a short TTL rather than an immutable one.
        location ~* \.(xml|xsl|txt|json|webmanifest|md)$ {
            limit_except GET HEAD { deny all; }
            add_header Cache-Control "public, max-age=3600" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # Pages. try_files covers Astro's default `directory` build format
        # (/about/ -> /about/index.html) and `build.format: 'file'`
        # (/about -> /about.html), so it works whichever you configure and for
        # either trailingSlash setting.
        #
        # HTML is never cached: it is the file that names the hashed assets, so
        # a stale copy pins visitors to assets that no longer exist.
        location / {
            limit_except GET HEAD { deny all; }
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri $uri/index.html $uri.html =404;

            # For an Astro app doing client-side routing, fall back to the shell
            # instead of 404ing:
            #   try_files $uri $uri/index.html $uri.html /index.html;
        }

        # `internal` keeps /404.html unreachable as a direct URL, so it is only
        # ever served through error_page — with the real 404 status attached.
        # The headers have to be repeated: this location does not inherit them.
        error_page 404 /404.html;
        location = /404.html {
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            include /etc/nginx/security-headers.conf;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
