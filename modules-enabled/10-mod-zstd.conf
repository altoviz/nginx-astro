# Zstandard — https://github.com/tokers/zstd-nginx-module
#
# Loaded FIRST on purpose. nginx runs body filters in the reverse of their
# registration order, so the module loaded *last* gets first refusal on a
# response. Loading zstd before brotli therefore makes brotli win when a browser
# advertises `Accept-Encoding: gzip, deflate, br, zstd` — see 20-mod-brotli.conf.
#
# To prefer zstd instead, rename these two files so brotli sorts first.

load_module modules/ngx_http_zstd_filter_module.so;
load_module modules/ngx_http_zstd_static_module.so;
