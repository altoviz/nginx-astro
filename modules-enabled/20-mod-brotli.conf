# Brotli — https://github.com/google/ngx_brotli
#
# Loaded LAST on purpose, so brotli beats zstd when the client supports both.
# That is the right default for pre-compressed static assets: brotli files are
# meaningfully smaller than zstd ones at the levels a build step uses, and every
# zstd-capable browser also sends `br`, so preferring brotli costs nothing.
#
# gzip_static is compiled into the stock nginx binary and needs no load_module;
# it acts as the final fallback. Overall precedence: brotli > zstd > gzip.

load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;
